name: GogaBugfix
description: "Bug fixing process"
---

- name: hotfix
  title: "Root-cause analysis and resolution"
  communication: true
  prompt: |
    Use the TODO file at the path printed by `goga history path -f todo.md`, if it exists.

    Cell convention:
    - When changing CODEMANIFEST and usage files, you **MUST** ensure the current state, **NOT** the changelogs.
    - Keep algorithms, requirements, constraints and usages succinct and to the point. Use clear bullet points and focus strictly on the required outcomes.
  skills:
    - goga-change

- name: commit-changes
  title: "Commit changes"
  prompt: |
    Commit all added and modified files

- name: accept-result
  title: "Requirements & coverage audit"
  communication: true
  prompt: |
    Commit changes after fixes
  skills:
    - goga-accept
