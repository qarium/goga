name: GogaRefinement
description: "Task refinement"
---

- name: define
  title: "Product definition & create PRD"
  communication: true
  prompt: |
    Save the PRD file as `docs/defines/<git branch --show-current>.md`

    Constrains:
    - Don't research a project until you receive the task
  skills:
    - goga-define

- name: discover
  title: "Technical discovery & create ADR"
  communication: true
  prompt: |
    Save the ADR file as `docs/proposals/<git branch --show-current>.md`

    Use `docs/defines/<git branch --show-current>.md` as the PRD file, if it exists
    If PRD file does not exist — ask user about task
  skills:
    - goga-discover

- name: propose
  title: "Task decomposition & create Task(s)"
  communication: true
  prompt: |
    Save the task file as `docs/tasks/<git branch --show-current>.md`

    Use `docs/proposals/<git branch --show-current>.md` as the task file, if it exists
    If propose does not exist — try `docs/defines/<git branch --show-current>.md` as the PRD file
    If PRD file does not exists — ask user about task
  skills:
    - goga-propose

- name: task-review
  title: "Review of the created task"
  communication: true
  prompt: |
    Review the task `docs/tasks/<git branch --show-current>.md`
  skills:
    - goga-review-task
