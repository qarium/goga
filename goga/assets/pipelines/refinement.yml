name: GogaRefinement
description: "Task refinement process"
---

- name: define
  title: "Product definition & create PRD"
  communication: true
  prompt: |
    Save the PRD file as `.goga/history/<year>/<git branch --show-current>/prd.md`
    where `<year>` is the current year in `YYYY` format (4 digits, zero-padded).

    Constrains:
    - Don't research a project until you receive the task
  skills:
    - goga-define

- name: discover
  title: "Technical discovery & create ADR"
  communication: true
  prompt: |
    Save the ADR file as `.goga/history/<year>/<git branch --show-current>/adr.md`
    where `<year>` is the current year in `YYYY` format (4 digits, zero-padded).

    Use `.goga/history/<year>/<git branch --show-current>/prd.md` as the PRD file, if it exists (any 4-digit year under `.goga/history/`).
    If PRD file does not exist — ask user about task.

    Communication:
    - You **MUST** follow the `File-Based Dialog Protocol` for every round of questions.
  skills:
    - goga-discover

- name: propose
  title: "Task decomposition & create Task(s)"
  communication: true
  prompt: |
    Save the task file as `.goga/history/<year>/<git branch --show-current>/task.md`
    where `<year>` is the current year in `YYYY` format (4 digits, zero-padded).

    Use `.goga/history/<year>/<git branch --show-current>/adr.md` as the task file, if it exists (any 4-digit year under `.goga/history/`).
    If ADR does not exist — try `.goga/history/<year>/<git branch --show-current>/prd.md` (any 4-digit year) as the PRD file.
    If PRD file does not exists — ask user about task.
  skills:
    - goga-propose

- name: task-review
  title: "Review of the created task"
  communication: true
  prompt: |
    Review the task `.goga/history/<year>/<git branch --show-current>/task.md` (any 4-digit year under `.goga/history/`)
  skills:
    - goga-review-task
