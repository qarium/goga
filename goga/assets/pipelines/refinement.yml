name: GogaRefinement
description: "Task refinement process"
---

- name: define
  title: "Product definition & create PRD"
  communication: true
  prompt: |
    Use the TODO file at the path printed by `goga history path -f todo.md`, if it exists.

    If the TODO file does not exist — ask user about task.

    Constrains:
    - Don't research a project until you receive the task
  skills:
    - goga-define

- name: discover
  title: "Technical discovery & create ADR"
  communication: true
  prompt: |
    Use the PRD file at the path printed by `goga history path -f prd.md`, if it exists.

    If the PRD file does not exist try TODO file at the path printed by `goga history path -f todo.md`.
    If the PRD and TODO files do not exist  — ask user about task.

    Constrains:
    - Don't research a project until you receive the task

    Communication:
    - You **MUST** follow the `File-Based Dialog Protocol` for every round of questions.
  skills:
    - goga-discover

- name: propose
  title: "Task decomposition & create Task(s)"
  communication: true
  prompt: |
    Use the ADR at the path printed by `goga history path -f adr.md` as the input for task formulation, if it exists.
  
    If the ADR does not exist — try the PRD file at the path printed by `goga history path -f prd.md`.
    If the ADR and PRD files do not exist try TODO file at the path printed by `goga history path -f todo.md`.
    If the PRD, ADR and TODO files do not exists — ask user about task.
  skills:
    - goga-propose

- name: task-review
  title: "Review of the created task"
  communication: true
  skills:
    - goga-review-task
