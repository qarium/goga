name: GogaRefinement
description: "Task refinement process"
---

- name: define
  title: "Product definition & create PRD"
  communication: true
  prompt: |
    Save the PRD file as `.goga/history/<year>/<git branch --show-current>/prd.md`
    (`<year>` = current year, `YYYY`; create the directory lazily)

    Constrains:
    - Don't research a project until you receive the task
  skills:
    - goga-define

- name: discover
  title: "Technical discovery & create ADR"
  communication: true
  prompt: |
    Use `.goga/history/<year>/<git branch --show-current>/prd.md` as the PRD file, if it exists (4-digit year).
    If PRD file does not exist — ask user about task.

    Save the ADR file as `.goga/history/<year>/<git branch --show-current>/adr.md`
    (`<year>` = current year, `YYYY`; create the directory lazily)

    Communication:
    - You **MUST** follow the `File-Based Dialog Protocol` for every round of questions.
  skills:
    - goga-discover

- name: propose
  title: "Task decomposition & create Task(s)"
  communication: true
  prompt: |
    Use the ADR `.goga/history/<year>/<git branch --show-current>/adr.md` as the input for task formulation, if it exists (4-digit year).
    If ADR does not exist — try `.goga/history/<year>/<git branch --show-current>/prd.md` (4-digit year) as the PRD file.
    If PRD file does not exists — ask user about task.

    Save the task file as `.goga/history/<year>/<git branch --show-current>/task.md`
    (`<year>` = current year, `YYYY`; create the directory lazily)
  skills:
    - goga-propose

- name: task-review
  title: "Review of the created task"
  communication: true
  prompt: |
    Review the task `.goga/history/<year>/<git branch --show-current>/task.md`
    (`<year>` = current year, `YYYY`)
  skills:
    - goga-review-task
