name: GogaRefinement
description: "Task refinement process"
---

- name: define
  title: "Product definition & create PRD"
  communication: true
  prompt: |
    Save the PRD file at the path printed by `goga history path -f prd.md`
    (run `goga history ensure` first if the topic directory does not exist)

    Constrains:
    - Don't research a project until you receive the task
  skills:
    - goga-define

- name: discover
  title: "Technical discovery & create ADR"
  communication: true
  prompt: |
    Use the PRD file at the path printed by `goga history path -f prd.md`, if it exists.
    If PRD file does not exist — ask user about task.

    Save the ADR file at the path printed by `goga history path -f adr.md`
    (run `goga history ensure` first if the topic directory does not exist)

    Communication:
    - You **MUST** follow the `File-Based Dialog Protocol` for every round of questions.
  skills:
    - goga-discover

- name: propose
  title: "Task decomposition & create Task(s)"
  communication: true
  prompt: |
    Use the ADR at the path printed by `goga history path -f adr.md` as the input for task formulation, if it exists.
    If ADR does not exist — try the PRD file at the path printed by `goga history path -f prd.md`.
    If PRD file does not exists — ask user about task.

    Save the task file at the path printed by `goga history path -f task.md`
    (run `goga history ensure` first if the topic directory does not exist)
  skills:
    - goga-propose

- name: task-review
  title: "Review of the created task"
  communication: true
  prompt: |
    Review the task file at the path printed by `goga history path -f task.md`
  skills:
    - goga-review-task
