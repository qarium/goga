name: GogaDevelopment
description: "Development process"
---

- name: brainstorm
  title: "Task-based architecture development"
  communication: true
  prompt: |
    Use the task `.goga/history/<year>/<topic>/task.md`, if it exists
    Save the architecture plan as `.goga/history/<year>/<topic>/arch.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name (`release/1.3.0` → `release-1-3-0`); create the directory lazily)

    **CODEMANIFEST files** must be described at a functional and business-logic level, remaining strictly implementation-agnostic:
    - Focus on defining "what" the system should achieve (expected behavior, business rules, inputs, and outputs) rather than "how" to code it.
    - Avoid embedding code snippets, database queries, or specific technology details in the requirement descriptions to leave room for optimal engineering design.

    **Usage files** must be fully self-contained, highly readable, and clear from a consumer's perspective:
    - API contracts must not reference or depend on other cells internal to the project's upper and peer layers.
    - To ensure clean layering (such as when designing a Facade), contracts may only depend on strict downward, lower-level cells or shared primitives.
    - The contract must expose the "what" of the cell without leaking internal architectural context.

    Cell convention:
    - When changing CODEMANIFEST and usage files, you **MUST** ensure the current state, **NOT** the changelogs.
    - Keep algorithms, requirements, constraints and usages succinct and to the point. Use clear bullet points and focus strictly on the required outcomes.
    - Highly complex and nested algorithms should be decomposed into smaller, single-responsibility components.
    - Avoid creating single-function files. Functions/Classes should be logically grouped into modules based on high cohesion and shared context.

    Communication:
    - When approving report content gates (PRIMARY_ANALYSIS_REPORT, TYPE_MAP_REPORT, CELL_DISTRIBUTION_REPORT, TYPE_DETAIL_REPORT, CELL_ASSEMBLY_REPORT),
      please provide full artifacts in the format specified in a question or propose to user.
  skills:
    - goga-brainstorm

- name: architecture-review
  title: "Review of the created architectural plan"
  communication: true
  prompt: |
    Review the architecture plan `.goga/history/<year>/<topic>/arch.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name)
  skills:
    - goga-review-arch

- name: apply-architecture
  title: "Apply the created architectural plan"
  prompt: |
    Apply the architecture plan `.goga/history/<year>/<topic>/arch.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name)
  skills:
    - goga-apply

- name: code-design
  title: "Designing architecture into code"
  communication: true
  prompt: |
    Save the design document as `.goga/history/<year>/<topic>/design.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name; create the directory lazily)
  skills:
    - goga-design

- name: design-review
  title: "Review of the created design plan"
  communication: true
  prompt: |
    Review the design document `.goga/history/<year>/<topic>/design.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name)
  skills:
    - goga-review-design

- name: coding-plan
  title: "Create the coding plan"
  communication: true
  prompt: |
    Use the design document `.goga/history/<year>/<topic>/design.md`
    Save the plan as `.goga/history/<year>/<topic>/plan.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name; create the directory lazily)
  skills:
    - goga-plan

- name: plan-review
  title: "Review of the created coding plan"
  communication: true
  prompt: |
    Review the plan `.goga/history/<year>/<topic>/plan.md`
    (`<year>` = current year, `YYYY`; `<topic>` = lowercase kebab-case slug of the
    current git branch name)
  skills:
    - goga-review-plan

- name: commit-changes
  title: "Commit changes"
  communication: true
  prompt: |
    Commit all added and modified files.

    Constraints:
    - Except changes in `.goga/history/`.

- name: accept-result
  title: "Contracts & coverage audit"
  communication: true
  trigger: manual
  prompt: |
    Commit changes after fixes
  skills:
    - goga-accept
