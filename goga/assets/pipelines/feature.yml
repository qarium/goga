name: Goga feature
description: "Feature implementation"

stages:
  - id: propose
    name: "Propose"
    interactive: true
    agents: [planning, implementation]
    prompt: |
      Save the task file as `<git branch --show-current>.md`
    skills:
      - goga-propose

  - id: propose-review
    name: "Propose Review"
    interactive: true
    prompt: |
      Review the task `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-review-task
    depends_on:
      - propose

  - id: brainstorm
    name: "Architecture Brainstorm"
    interactive: true
    prompt: |
      Use the task `<git branch --show-current>.md`
      Save the architecture plan as `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-brainstorm
    depends_on:
      - propose-review

  - id: brainstorm-review
    name: "Architecture Review"
    interactive: true
    prompt: |
      Review the architecture plan `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-review-arch
    depends_on:
      - brainstorm

  - id: apply
    name: "Apply Architecture"
    prompt: |
      Apply the architecture plan `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-apply
    depends_on:
      - brainstorm-review

  - id: design
    name: "Design Architecture To Code"
    interactive: true
    prompt: |
      Save the design document as `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-design
    depends_on:
      - apply

  - id: design-review
    name: "Design Review"
    interactive: true
    prompt: |
      Review the design document `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-review-design
    depends_on:
      - design

  - id: plan
    name: "Plan"
    interactive: true
    prompt: |
      Use the design document `<git branch --show-current>.md`
      Save the plan as `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-plan
    depends_on:
      - design-review

  - id: plan-review
    name: "Plan Review"
    interactive: true
    prompt: |
      Review the plan `<git branch --show-current>.md`
    agents: [planning, implementation]
    skills:
      - goga-review-plan
    depends_on:
      - plan

  - id: fix-changes
    name: "Fix changes"
    interactive: true
    prompt: |
      Steps:
        1. Commit all changes.
        2. Ask the user whether the implementation is built and ready for acceptance.

      Requirements:
        - If the user confirms it is ready for acceptance — complete the execution.

      Constraints:
        - Don't autoconfirm user answer.
        - Except changes in `docs/<tasks|arch|design|plans>`.
    agents: [planning, implementation]
    depends_on:
      - plan-review

  - id: accept
    name: "Accept Result"
    interactive: true
    skills:
      - goga-accept
    agents: [planning, implementation]
    depends_on:
      - fix-changes
