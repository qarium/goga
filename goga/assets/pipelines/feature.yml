name: GogaFeature
description: "Feature implementation"
---

- name: propose
  description: "Create the task from a user propose"
  interactive: true
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

- name: task-review
  description: "Review of the created task"
  interactive: true
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task

- name: brainstorm
  description: "Task-based architecture development"
  interactive: true
  prompt: |
    Use the task `<git branch --show-current>.md`
    Save the architecture plan as `<git branch --show-current>.md`
  skills:
    - goga-brainstorm

- name: architecture-review
  description: "Review of the created architectural plan"
  interactive: true
  prompt: |
    Review the architecture plan `<git branch --show-current>.md`
  skills:
    - goga-review-arch

- name: apply
  description: "Apply the created architectural plan"
  prompt: |
    Apply the architecture plan `<git branch --show-current>.md`
  skills:
    - goga-apply

- name: design
  description: "Designing architecture into code"
  interactive: true
  prompt: |
    Save the design document as `<git branch --show-current>.md`
  skills:
    - goga-design

- name: design-review
  description: "Review of the created design plan"
  interactive: true
  prompt: |
    Review the design document `<git branch --show-current>.md`
  skills:
    - goga-review-design

- name: plan
  description: "Create the coding plan"
  interactive: true
  prompt: |
    Use the design document `<git branch --show-current>.md`
    Save the plan as `<git branch --show-current>.md`
  skills:
    - goga-plan

- name: plan-review
  description: "Review of the created coding plan"
  interactive: true
  prompt: |
    Review the plan `<git branch --show-current>.md`
  skills:
    - goga-review-plan

- name: commit-changes
  description: "Commit changes and wait for the coding plan was built"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Steps:
      1. Commit all untracked changes.
      2. Ask the user whether the implementation is built and ready for acceptance.

    Requirements:
      - If the user confirms it is ready for acceptance — complete the execution.

    Constraints:
      - Don't autoconfirm user answer.
      - Except changes in `docs/<tasks|arch|design|plans>`.

- name: accept
  description: "Requirements & coverage audit"
  interactive: true
  skills:
    - goga-accept
