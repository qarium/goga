docs_dir: docs

site_name: goga
site_description: A tool for working with the codemanifest specification — assembly, extension, and plan-building workflow
site_url: https://qarium.github.io/goga/
repo_url: https://github.com/qarium/goga
edit_uri: edit/0.0.x/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://avatars.githubusercontent.com/u/262344922?s=200&v=4
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        media: "(prefers-color-scheme: dark)"
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Cell:
      - cell/index.md
      - CODEMANIFEST: cell/codemanifest.md
      - Usages: cell/usages.md
  - Configuration: configuration.md
  - CLI:
      - cli/index.md
      - Init: cli/init.md
      - Lint: cli/lint.md
      - Build: cli/build.md
      - Contract: cli/contract.md
      - Config: cli/config.md
      - Schema: cli/schema.md
      - Connect: cli/connect.md
      - Tool: cli/tool.md
  - Architecture:
      - architecture/index.md
      - AST Nodes: architecture/ast-nodes.md
      - AST Factory: architecture/ast-factory.md
      - AST Visitor: architecture/ast-visitor.md
      - AST Analyzer: architecture/ast-analyzer.md
      - AST Errors: architecture/ast-errors.md
      - Validation Rules: architecture/validation-rules.md
      - Contract Extraction: architecture/contract-extraction.md
  - Languages:
      - languages/index.md
      - Python: languages/python.md
      - Go: languages/golang.md
      - Kotlin: languages/kotlin.md
      - Swift: languages/swift.md
      - JavaScript: languages/javascript.md
