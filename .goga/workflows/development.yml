prompt: |
  Answer (feedbacks, proposes, questions and etc) in Russian language.

stages:
  brainstorm:
    prompt: |
      Architectural design process.

      Use the memory file `.goga/memory/development.md` as project rules if exists. The file is read only.

      Requirements:
      - Annotations describe the high-level order of actions
      - Every usage file is connected through Imports and referenced in annotations
      - Usage files are self-contained
      - Footer Description describes the responsibility zone
      - Before deciding how to do something, reflect on the memory file.

      Constraints:
      - Annotations must not reference previous functionality
      - Annotations does not contains implementation details
      - Annotations must not use "X from Imports" phrasing
      - Footer Description does not contains details
  architecture-review:
    approve: auto
  apply-architecture:
    approve: auto
  code-design:
    approve: auto
  design-review:
    approve: auto
  coding-plan:
    approve: auto
  plan-review:
    approve: auto
  accept-result:
    manual: false

extend:
  build:
    title: "Build implementation"
    after:
      - commit-changes
    timeout: "8h"
    script: |
      plan=$(python3 -m goga history path -f plan.md) || exit 1
      python3 -m goga.build "$plan"
    after_script: rm -rf .ralphex
