profile: default

prompt: |
  Answer (feedbacks, proposes, questions:`*.question.json` and etc) in {{ language }} language.
  Any content written to the project files is in English.

memory:
  max_rules: 15
  commit: true

{% macro stage_config(stage_data) %}
{% if stage_data["agent"] %}
    agent: {{ stage_data["agent"] }}
{% endif %}
{% if stage_data["env"] %}
    env:
{% for k, v in stage_data["env"].items() %}
      {{ k }}: "{{ v }}"
{% endfor %}
{% endif %}
{% endmacro %}

stages:
  prototype-architecture:
{{ stage_config(stages["prototype-architecture"]) }}
    prompt: |
      Architectural design process.

      Requirements:
      - Annotations describe the high-level order of actions
      - Every usage file is connected through Imports and referenced in annotations
      - Usage files are self-contained
      - Footer Description describes the responsibility zone
      - Before deciding how to do something, reflect on the memory file.

      Constraints:
      - Annotations must not reference previous functionality
      - Annotations does not contains implementation details
      - Annotations must not use "X from Imports" phrasing
      - Footer Description does not contains details
    reflect:
      file: architecture.md
  architecture-review:
{{ stage_config(stages["architecture-review"]) }}
    approve: auto
  apply-architecture:
{{ stage_config(stages["apply-architecture"]) }}
    approve: auto
  code-design:
{{ stage_config(stages["code-design"]) }}
    approve: auto
    reflect:
      file: code-design.md
      mode: r
  design-review:
{{ stage_config(stages["design-review"]) }}
    approve: auto
    reflect:
      file: code-design.md
  coding-plan:
{{ stage_config(stages["coding-plan"]) }}
    approve: auto
  plan-review:
{{ stage_config(stages["plan-review"]) }}
    approve: auto
  commit-changes:
{{ stage_config(stages["commit-changes" ]) }}
  accept-result:
{{ stage_config(stages["accept-result"]) }}
    manual: false

extend:
  build:
    title: "Build implementation"
    after:
      - commit-changes
    timeout: "8h"
    script: python3 -P -m goga.build "$(python3 -m goga history path -f plan.md)"
    after_script: rm -rf .ralphex
