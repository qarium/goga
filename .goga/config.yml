language: python

image: qarium/goga:latest
dockerfile: Dockerfile

.base-ref: &base-ref release/2.0.0

.claude-env: &claude-env
  ANTHROPIC_MODEL: opus
  ANTHROPIC_BASE_URL: "https://api.z.ai/api/anthropic"

build:
  agent: claude
  env:
    <<: *claude-env
    ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.1"
  review:
    agent: claude
    base_ref: *base-ref
    max_iterations: 5
    env:
      <<: *claude-env
      ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.3[1m]"

pipeline:
  agent: claude
  env:
    <<: *claude-env
    ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.3[1m]"

topics:
  base_ref: *base-ref

lint:
  ignore:
    - build/
    - .venv/

codemanifest:
  usages:
    convention: .goga/usages/conventions.md
  annotations: |
    The `convention` practice is used for:
    - Working with the codebase
    - Organizing the REPL development cycle
    - Debugging and testing
    - Organizing the test infrastructure
    - Understanding the general principles and rules of development and testing in the project
