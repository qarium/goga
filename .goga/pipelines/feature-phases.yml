name: Goga feature
description: "Feature implementation"
---

- name: propose
  description: "Propose"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

- name: propose-review
  description: "Propose Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task

- name: brainstorm
  description: "Architecture Brainstorm"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Use the task `<git branch --show-current>.md`
    Save the architecture plan as `<git branch --show-current>.md`
  skills:
    - goga-brainstorm

- name: brainstorm-review
  description: "Architecture Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the architecture plan `<git branch --show-current>.md`
  skills:
    - goga-review-arch

- name: apply
  description: "Apply Architecture"
  agents:
    - planning
    - implementation
  prompt: |
    Apply the architecture plan `<git branch --show-current>.md`
  skills:
    - goga-apply

- name: design
  description: "Design Architecture To Code"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the design document as `<git branch --show-current>.md`
  skills:
    - goga-design

- name: design-review
  description: "Design Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the design document `<git branch --show-current>.md`
  skills:
    - goga-review-design

- name: plan
  description: "Plan"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Use the design document `<git branch --show-current>.md`
    Save the plan as `<git branch --show-current>.md`
  skills:
    - goga-plan

- name: plan-review
  description: "Plan Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the plan `<git branch --show-current>.md`
  skills:
    - goga-review-plan

- name: fix-changes
  description: "Fix changes"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Steps:
      1. Commit all changes.
      2. Ask the user whether the implementation is built and ready for acceptance.

    Requirements:
      - If the user confirms it is ready for acceptance — complete the execution.

    Constraints:
      - Don't autoconfirm user answer.
      - Except changes in `docs/<tasks|arch|design|plans>`.

- name: accept
  description: "Accept Result"
  interactive: true
  agents:
    - planning
    - implementation
  skills:
    - goga-accept
