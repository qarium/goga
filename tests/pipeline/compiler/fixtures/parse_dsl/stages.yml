name: Goga feature
description: "Feature implementation"
---

propose:
  title: "Propose"
  communication: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

propose-review:
  title: "Propose Review"
  communication: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task
  depends_on:
    - propose

accept:
  title: "Accept Result"
  communication: true
  agents:
    - planning
    - implementation
  skills:
    - goga-accept
  depends_on:
    - propose-review
