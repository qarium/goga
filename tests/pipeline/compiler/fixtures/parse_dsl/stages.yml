name: Goga feature
description: "Feature implementation"
---

propose:
  description: "Propose"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

propose-review:
  description: "Propose Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task
  depends_on:
    - propose

accept:
  description: "Accept Result"
  interactive: true
  agents:
    - planning
    - implementation
  skills:
    - goga-accept
  depends_on:
    - propose-review
