name: Goga feature
description: "Feature implementation"
---

propose:
  title: "Propose"
  communication: true
  roles:
    - planner
    - executor
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

propose-review:
  title: "Propose Review"
  communication: true
  roles:
    - planner
    - executor
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task
  depends_on:
    - propose
