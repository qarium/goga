name: Goga feature
description: "Feature implementation"
---

- name: propose
  title: "Propose"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

- name: propose-review
  title: "Propose Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task

- name: brainstorm
  title: "Architecture Brainstorm"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Use the task `<git branch --show-current>.md`
    Save the architecture plan as `<git branch --show-current>.md`
  skills:
    - goga-brainstorm
