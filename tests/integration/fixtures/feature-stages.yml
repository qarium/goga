name: Goga feature
description: "Feature implementation"
---

propose:
  title: "Propose"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Save the task file as `<git branch --show-current>.md`
  skills:
    - goga-propose

propose-review:
  title: "Propose Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the task `<git branch --show-current>.md`
  skills:
    - goga-review-task
  depends_on:
    - propose

brainstorm:
  title: "Architecture Brainstorm"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Use the task `<git branch --show-current>.md`
    Save the architecture plan as `<git branch --show-current>.md`
  skills:
    - goga-brainstorm
  depends_on:
    - propose-review

brainstorm-review:
  title: "Architecture Review"
  interactive: true
  agents:
    - planning
    - implementation
  prompt: |
    Review the architecture plan `<git branch --show-current>.md`
  skills:
    - goga-review-arch
  depends_on:
    - brainstorm
