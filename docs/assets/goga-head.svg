<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <style>
    @keyframes gogaBlink {
      0%, 44%, 50%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(0.05); }
    }
    @keyframes gogaAntennaPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes gogaFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .goga-head-root {
      animation: gogaFloat 3s ease-in-out infinite;
      transform-origin: 100px 100px;
    }
    .goga-eye-l, .goga-eye-r {
      transform-origin: center;
      animation: gogaBlink 4s ease-in-out infinite;
    }
    .goga-eye-l { transform-origin: 78px 70px; }
    .goga-eye-r { transform-origin: 122px 70px; }
    .goga-antenna-tip {
      animation: gogaAntennaPulse 2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .goga-head-root, .goga-eye-l, .goga-eye-r, .goga-antenna-tip {
        animation: none;
      }
    }
  </style>

  <!-- Antenna -->
  <line x1="100" y1="20" x2="100" y2="44" stroke="#20D4BF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="16" r="6" fill="#20D4BF"/>
  <circle class="goga-antenna-tip" cx="100" cy="16" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Head outline (works on any background) -->
  <rect x="40" y="44" width="120" height="92" rx="26"
        fill="none" stroke="#20D4BF" stroke-width="3"/>

  <!-- Eyes -->
  <g class="goga-eye-l">
    <ellipse cx="78" cy="70" rx="10" ry="12" fill="#20D4BF"/>
    <ellipse cx="80" cy="68" rx="4" ry="5" fill="#ffffff" opacity="0.95"/>
  </g>
  <g class="goga-eye-r">
    <ellipse cx="122" cy="70" rx="10" ry="12" fill="#20D4BF"/>
    <ellipse cx="124" cy="68" rx="4" ry="5" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Smile -->
  <path d="M78 100 Q100 118 122 100" stroke="#20D4BF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>